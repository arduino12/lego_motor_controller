; Fake "powerbox" car: lets the car's own remote connect and prints what it writes.
[platformio]
default_envs = esp32-c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; BLE: the library bundled with the Arduino-ESP32 core (NimBLE-Arduino 1.4 crashes on core 3.3)

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c3]
board = esp32-c3-devkitm-1
; boards wired to the C3's own USB (Serial/JTAG, 303a:1001): print over USB-CDC
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = COM75
monitor_port = COM75
