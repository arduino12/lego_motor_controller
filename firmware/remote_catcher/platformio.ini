; Plays the "powerbox" car as a BLE *central*, with the car's address, to catch its remote if the
; remote is the peripheral (e.g. directed advertising to the car). Classic ESP32 (Bluedroid) only.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
